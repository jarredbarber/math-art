<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Polyrhythm Core Browser Tests</title>
  <style>body{font:16px/1.5 system-ui,sans-serif;margin:2rem;background:#090d15;color:#edf2f7}#summary{font-size:1.5rem;font-weight:700}.pass{color:#6ee7b7}.fail{color:#fb7185}pre{white-space:pre-wrap}</style>
</head>
<body>
  <h1>Polyrhythm Core Browser Tests</h1>
  <p id="summary">Running…</p>
  <pre id="details"></pre>
  <iframe id="app" src="../index.html" hidden></iframe>
  <script>
    const summary = document.querySelector("#summary");
    const details = document.querySelector("#details");
    const frame = document.querySelector("#app");
    function assertEqual(actual, expected, message) {
      if (JSON.stringify(actual) !== JSON.stringify(expected)) {
        throw new Error(`${message}\nExpected: ${JSON.stringify(expected)}\nActual: ${JSON.stringify(actual)}`);
      }
    }
    frame.addEventListener("load", () => {
      const core = frame.contentWindow.PolyrhythmCore;
      const pattern = (length, cells = []) => ({ length, cells: Array.from({ length }, (_, index) => cells[index] ?? "rest") });
      const cases = [
        ["gcd and lcm", () => { assertEqual(core.gcd(45, 4), 1, "gcd"); assertEqual(core.lcm(16, 6), 48, "lcm"); assertEqual(core.lcm(63, 64), 4032, "maximum lcm"); }],
        ["cycle length", () => { const exercise = { loopMode: "independent", phraseLength: 32, patterns: [pattern(16), pattern(6)] }; assertEqual(core.cycleLength(exercise), 48, "independent"); exercise.loopMode = "phrase"; assertEqual(core.cycleLength(exercise), 32, "phrase"); }],
        ["repeating cells", () => { const p = pattern(3, ["hit", "rest", "accent"]); assertEqual(core.cellAt(p, 0), "hit", "step 0"); assertEqual(core.cellAt(p, 4), "rest", "step 4"); assertEqual(core.cellAt(p, 8), "accent", "step 8"); }],
        ["row segmentation", () => assertEqual(core.segmentRows(45, 16), [{ start: 0, length: 16 }, { start: 16, length: 16 }, { start: 32, length: 13 }], "segments")],
        ["cell states", () => { assertEqual(core.cycleCell("rest"), "hit", "rest"); assertEqual(core.cycleCell("hit"), "accent", "hit"); assertEqual(core.cycleCell("accent"), "rest", "accent"); }],
        ["grouping", () => { assertEqual(core.parseGrouping("5, 5,3"), [5, 5, 3], "parse"); assertEqual(core.applyGrouping(pattern(4, ["hit", "rest", "accent"]), "3,3").length, 6, "apply"); }],
        ["presets and validation", () => { assertEqual(core.cycleLength(core.PRESETS.bleed), 48, "Bleed cycle"); assertEqual(core.cycleLength(core.PRESETS.artOfDying), 180, "Art of Dying cycle"); const invalid = core.createBlankExercise(); invalid.bpm = 301; assertEqual(core.validateExercise(invalid).valid, false, "invalid BPM"); }],
        ["group boundaries", () => { const p = { ...pattern(8), grouping: [3, 5] }; assertEqual(core.groupBoundaryAt(p, 0), { startsGroup: true, size: 3 }, "first group"); assertEqual(core.groupBoundaryAt(p, 8), { startsGroup: true, size: 3 }, "repeated group"); assertEqual(core.groupBoundaryAt(p, 2), null, "not a group start"); }],
        ["timeline rows", () => { const exercise = core.createBlankExercise(); exercise.patterns = [pattern(4, ["hit"]), pattern(3, ["accent"])]; exercise.stepsPerRow = 5; const rows = core.timelineRows(exercise); assertEqual(rows.length, 3, "row count"); assertEqual(rows[0].a, ["hit", "rest", "rest", "rest", "hit"], "A projection"); assertEqual(rows[0].b, ["accent", "rest", "rest", "accent", "rest"], "B projection"); }],
        ["sixteenth-note timing", () => { assertEqual(core.secondsPerStep(60), .25, "60 BPM"); assertEqual(core.secondsPerStep(120), .125, "120 BPM"); }],
        ["scheduled events", () => { const exercise = core.createBlankExercise(); exercise.patterns = [pattern(4, ["hit", "rest", "accent", "rest"]), pattern(3, ["rest", "hit", "rest"])]; exercise.metronome = true; const events = core.eventsInRange(exercise, 0, 5); if (!events.some(event => event.source === "a" && event.step === 0 && event.state === "hit")) throw new Error("missing A hit"); if (!events.some(event => event.source === "a" && event.step === 2 && event.state === "accent")) throw new Error("missing A accent"); if (!events.some(event => event.source === "b" && event.step === 1)) throw new Error("missing B hit"); if (!events.some(event => event.source === "metronome" && event.step === 0)) throw new Error("missing metronome"); if (!events.some(event => event.source === "a" && event.step === 4)) throw new Error("missing wrapped hit"); }],
        ["silent events", () => { const exercise = core.createBlankExercise(); exercise.metronome = false; exercise.patterns[0].muted = true; exercise.patterns[1].cells.fill("rest"); assertEqual(core.eventsInRange(exercise, 0, 16), [], "muted and empty patterns"); }],
        ["JSON interchange", () => { const source = core.cloneExercise(core.PRESETS.bleed); source.name = "Browser round trip"; assertEqual(core.parseExerciseJson(core.serializeExercise(source)), source, "round trip"); const future = core.createBlankExercise(); future.schemaVersion = 2; let rejected = false; try { core.parseExerciseJson(JSON.stringify(future)); } catch { rejected = true; } if (!rejected) throw new Error("unsupported version was accepted"); }],
        ["required controls", () => { const source = frame.contentDocument.documentElement.outerHTML; for (const label of ["BPM", "Count-in", "Metronome", "Steps per row", "Independent", "Phrase", "Kick", "Snare", "Hi-hat", "Woodblock", "Click", "Bleed", "The Art of Dying", "Import", "Export"]) if (!source.includes(label)) throw new Error(`missing ${label}`); }],
      ];
      const failures = [];
      for (const [name, run] of cases) { try { run(); } catch (error) { failures.push(`${name}: ${error.stack}`); } }
      const passed = cases.length - failures.length;
      summary.textContent = `${passed} passed, ${failures.length} failed`;
      summary.className = failures.length ? "fail" : "pass";
      details.textContent = failures.join("\n\n");
    });
  </script>
</body>
</html>
