<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Cosine Map</title>
<style>
  :root {
    --bg: #0f1115;
    --panel: #161a22;
    --panel-2: #1d222c;
    --border: #2a313d;
    --text: #e6e8ee;
    --muted: #8b93a3;
    --accent: #6ea8fe;
    --accent-2: #4d8bff;
    --danger: #ff6b6b;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    display: flex;
    overflow: hidden;
  }
  #params {
    width: 340px;
    flex: 0 0 340px;
    background: var(--panel);
    border-right: 1px solid var(--border);
    padding: 18px;
    overflow-y: auto;
  }
  #params h1 {
    font-size: 16px;
    font-weight: 600;
    margin: 0 0 4px;
    letter-spacing: 0.3px;
  }
  .subtitle {
    font-size: 11px;
    color: var(--muted);
    margin-bottom: 16px;
  }
  .subtitle a { color: var(--accent); text-decoration: none; }
  .section { margin-bottom: 18px; }
  .section-title {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: var(--muted);
    margin-bottom: 8px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .row {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 6px;
  }
  .row > label {
    font-size: 12px;
    color: var(--muted);
    width: 100px;
    flex-shrink: 0;
  }
  input[type="color"] {
    width: 36px;
    height: 28px;
    border: 1px solid var(--border);
    border-radius: 6px;
    background: var(--panel-2);
    padding: 0;
    cursor: pointer;
  }
  input[type="number"], input[type="text"], select {
    flex: 1;
    background: var(--panel-2);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 6px 8px;
    font: inherit;
    min-width: 0;
  }
  button {
    background: var(--panel-2);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 6px 10px;
    font: inherit;
    cursor: pointer;
    transition: background 0.12s, border-color 0.12s;
  }
  button:hover:not(:disabled) { background: #242a35; border-color: #38414f; }
  button:disabled { opacity: 0.4; cursor: not-allowed; }
  button.primary {
    background: var(--accent-2);
    border-color: var(--accent-2);
    color: white;
    font-weight: 600;
  }
  button.primary:hover:not(:disabled) { background: var(--accent); border-color: var(--accent); }
  button.icon { width: 28px; height: 28px; padding: 0; }
  .button-row { display: flex; gap: 8px; }
  .button-row > * { flex: 1; }
  #matrix-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 4px;
  }
  #matrix-grid input {
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 11px;
    padding: 4px 6px;
    text-align: right;
    background: var(--panel-2);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 4px;
    width: 100%;
  }
  .matrix-controls {
    display: flex;
    gap: 6px;
    margin-top: 6px;
  }
  .matrix-controls > * { flex: 1; }
  #canvas-pane {
    flex: 1;
    position: relative;
    overflow: hidden;
    background: #14171d;
  }
  #canvas {
    width: 100%;
    height: 100%;
    display: block;
    cursor: grab;
  }
  #canvas.dragging { cursor: grabbing; }
  #status {
    position: absolute;
    bottom: 10px;
    left: 12px;
    font-size: 11px;
    color: var(--muted);
    background: rgba(15, 17, 21, 0.7);
    padding: 4px 8px;
    border-radius: 4px;
    pointer-events: none;
  }
  #progress { margin-top: 12px; display: none; }
  #progress.active { display: block; }
  #progress-label {
    font-size: 12px;
    color: var(--muted);
    margin-bottom: 8px;
    display: flex;
    justify-content: space-between;
  }
  #progress-bar {
    height: 8px;
    background: var(--panel-2);
    border-radius: 4px;
    overflow: hidden;
  }
  #progress-fill {
    height: 100%;
    background: var(--accent-2);
    width: 0%;
    transition: width 0.1s linear;
  }
  .preset-row { display: flex; gap: 6px; }
  .preset-row select { flex: 1; }
</style>
</head>
<body>

<aside id="params">
  <h1>Cosine Map</h1>
  <div class="subtitle">
    Chaotic iterated map: x,y,z ← cos(M · (x,y,z)).<br/>
    <a href="https://github.com/jarredbarber/math-art">github.com/jarredbarber/math-art</a>
  </div>

  <div class="section">
    <div class="section-title"><span>Matrix generation</span></div>
    <div class="row">
      <label>Process</label>
      <select id="process">
        <option value="sparse">Sparse uniform</option>
        <option value="dense">Dense uniform</option>
        <option value="rank1">Low-rank (1)</option>
        <option value="rank2">Low-rank (2)</option>
        <option value="symmetric">Symmetric</option>
        <option value="skew">Skew-symmetric</option>
        <option value="triangular">Triangular</option>
        <option value="banded">Banded (tridiag)</option>
        <option value="integer">Small integer</option>
      </select>
    </div>
    <div class="row">
      <input type="text" id="seed" value="2015425023" />
      <button id="random-seed" title="Random seed">🎲</button>
    </div>
    <div class="row">
      <select id="preset-seeds">
        <option value="">— Preferred seeds —</option>
        <option value="1531709689">1531709689</option>
        <option value="561322992">561322992</option>
        <option value="710840554">710840554</option>
        <option value="1364124509">1364124509</option>
        <option value="4080570164">4080570164</option>
        <option value="2015425023">2015425023</option>
        <option value="2463441566">2463441566</option>
      </select>
    </div>
  </div>

  <div class="section">
    <div class="section-title"><span>Rendering</span></div>
    <div class="row">
      <label>Points</label>
      <input type="number" id="n-pts" value="500000" min="1000" step="1000" />
    </div>
    <div class="row">
      <label></label>
      <button id="pts-half" style="flex:0 0 auto;">÷2</button>
      <button id="pts-double" style="flex:0 0 auto;">×2</button>
    </div>
    <div class="row">
      <label>Canvas size</label>
      <input type="number" id="render-size" value="1024" min="128" max="8192" step="128" />
    </div>
    <div class="row">
      <label>Mode</label>
      <select id="mode">
        <option value="density">Density (HDR)</option>
        <option value="scatter">Scatter (classic)</option>
      </select>
    </div>
    <div class="row" id="engine-row">
      <label>Engine</label>
      <select id="engine">
        <option value="auto">Auto (WebGPU if available)</option>
        <option value="webgpu">WebGPU</option>
        <option value="workers">CPU (workers)</option>
      </select>
    </div>
    <div class="row" id="workers-row">
      <label>Workers</label>
      <select id="workers">
        <option value="1">1</option>
        <option value="2">2</option>
        <option value="4">4</option>
        <option value="8">8</option>
        <option value="16">16</option>
      </select>
    </div>
    <div class="row" id="point-size-row">
      <label>Point size</label>
      <input type="number" id="pt-size" value="1.5" min="0.5" max="20" step="0.5" />
    </div>
    <div class="row" id="alpha-row">
      <label>Alpha</label>
      <input type="number" id="alpha" value="0.15" min="0.01" max="1" step="0.01" />
    </div>
    <div class="row" id="gamma-row">
      <label>Gamma</label>
      <input type="range" id="gamma" value="0.55" min="0.05" max="2" step="0.01" style="flex:1;" />
      <span id="gamma-val" style="font-size: 11px; color: var(--muted); width: 36px; text-align: right; font-variant-numeric: tabular-nums;">0.55</span>
    </div>
  </div>

  <div class="section">
    <div class="section-title"><span>Colors</span></div>
    <div class="row">
      <label>Background</label>
      <input type="color" id="bg-color" value="#0a0d12" />
    </div>
    <div class="row">
      <label>Color 1 (z=−1)</label>
      <input type="color" id="color1" value="#006bad" />
    </div>
    <div class="row">
      <label>Color 2 (z=+1)</label>
      <input type="color" id="color2" value="#ad4200" />
    </div>
  </div>

  <div class="section">
    <div class="button-row">
      <button class="primary" id="render">Generate</button>
      <button id="stop" disabled>Stop</button>
      <button id="export">Export PNG</button>
    </div>
    <div class="button-row" style="margin-top: 8px;">
      <button id="reset">Reset to defaults</button>
    </div>
    <div id="progress">
      <div id="progress-label"><span id="progress-text">Computing…</span><span id="progress-pct">0%</span></div>
      <div id="progress-bar"><div id="progress-fill"></div></div>
    </div>
  </div>

  <div class="section">
    <div class="section-title"><span>Matrix</span></div>
    <div id="matrix-grid"></div>
    <div class="matrix-controls">
      <button id="matrix-regen" title="Regenerate from current seed + process">Regen</button>
    </div>
  </div>
</aside>

<div id="canvas-pane">
  <canvas id="canvas"></canvas>
  <div id="status">Click Generate</div>
</div>

<script>
(() => {
  // ---- Defaults & state ----
  const DEFAULTS = {
    seed: 2015425023,
    nPts: 500000,
    renderSize: 1024,
    mode: 'density',
    ptSize: 1.5,
    alpha: 0.15,
    gamma: 0.55,
    bgColor: '#0a0d12',
    color1: '#006bad',
    color2: '#ad4200',
    workers: Math.min(8, Math.max(1, (navigator.hardwareConcurrency || 4))),
    engine: 'auto',
    process: 'sparse',
    mat: null, // filled at init from seed
  };

  const state = { ...DEFAULTS, rendered: null, density: null };

  // ---- DOM ----
  const $ = id => document.getElementById(id);
  const seedInput = $('seed');
  const randomSeedBtn = $('random-seed');
  const presetSeeds = $('preset-seeds');
  const nPtsInput = $('n-pts');
  const ptsHalf = $('pts-half');
  const ptsDouble = $('pts-double');
  const renderSizeInput = $('render-size');
  const modeSelect = $('mode');
  const ptSizeInput = $('pt-size');
  const alphaInput = $('alpha');
  const gammaInput = $('gamma');
  const bgColorInput = $('bg-color');
  const color1Input = $('color1');
  const color2Input = $('color2');
  const workersInput = $('workers');
  const engineInput = $('engine');
  const processInput = $('process');
  const matrixGrid = $('matrix-grid');
  const matrixRegen = $('matrix-regen');
  const renderBtn = $('render');
  const stopBtn = $('stop');
  const exportBtn = $('export');
  const resetBtn = $('reset');
  const matrixDisplay = $('matrix-display');
  const canvas = $('canvas');
  const ctx = canvas.getContext('2d');
  const statusEl = $('status');
  const progressEl = $('progress');
  const progressFill = $('progress-fill');
  const progressText = $('progress-text');
  const progressPct = $('progress-pct');

  // ---- Persistence ----
  const STORAGE_KEY = 'cosmap-state-v1';
  function save() {
    try {
      const s = {};
      for (const k of Object.keys(DEFAULTS)) s[k] = state[k];
      localStorage.setItem(STORAGE_KEY, JSON.stringify(s));
    } catch (e) {}
  }
  function load() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) return;
      const s = JSON.parse(raw);
      for (const k of Object.keys(DEFAULTS)) {
        if (s[k] !== undefined) state[k] = s[k];
      }
    } catch (e) {}
  }

  function syncInputsFromState() {
    seedInput.value = state.seed;
    nPtsInput.value = state.nPts;
    renderSizeInput.value = state.renderSize;
    modeSelect.value = state.mode;
    ptSizeInput.value = state.ptSize;
    alphaInput.value = state.alpha;
    gammaInput.value = state.gamma;
    const gv = document.getElementById('gamma-val');
    if (gv) gv.textContent = (+state.gamma).toFixed(2);
    bgColorInput.value = state.bgColor;
    color1Input.value = state.color1;
    color2Input.value = state.color2;
    workersInput.value = state.workers;
    engineInput.value = state.engine;
    processInput.value = state.process;
    if (!state.mat || state.mat.length !== 9) {
      state.mat = Array.from(randomMatrix(state.seed, state.process));
    }
    syncMatrixUI();
    updateModeRows();
  }
  function syncStateFromInputs() {
    state.seed = parseInt(seedInput.value, 10) >>> 0;
    state.nPts = Math.max(100, parseInt(nPtsInput.value, 10) || DEFAULTS.nPts);
    state.renderSize = Math.max(128, Math.min(8192, parseInt(renderSizeInput.value, 10) || DEFAULTS.renderSize));
    state.mode = modeSelect.value;
    state.ptSize = parseFloat(ptSizeInput.value) || DEFAULTS.ptSize;
    state.alpha = parseFloat(alphaInput.value) || DEFAULTS.alpha;
    state.gamma = parseFloat(gammaInput.value) || DEFAULTS.gamma;
    state.bgColor = bgColorInput.value;
    state.color1 = color1Input.value;
    state.color2 = color2Input.value;
    state.workers = Math.max(1, parseInt(workersInput.value, 10) || DEFAULTS.workers);
    state.engine = engineInput.value;
    state.process = processInput.value;
  }

  function updateModeRows() {
    const dens = modeSelect.value === 'density';
    $('point-size-row').style.display = dens ? 'none' : '';
    $('alpha-row').style.display = dens ? 'none' : '';
    $('gamma-row').style.display = dens ? '' : 'none';
    $('engine-row').style.display = dens ? '' : 'none';
    const usingGPU = dens && (engineInput.value === 'webgpu' || (engineInput.value === 'auto' && gpuAvailable));
    $('workers-row').style.display = dens && !usingGPU ? '' : 'none';
  }

  // ---- PRNG (mulberry32) ----
  function mulberry32(seed) {
    let a = seed >>> 0;
    return function() {
      a = (a + 0x6D2B79F5) >>> 0;
      let t = a;
      t = Math.imul(t ^ (t >>> 15), t | 1);
      t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  function randomMatrix(seed, process) {
    const rng = mulberry32(seed);
    const mat = new Float64Array(9);
    const u = () => (rng() * 2 - 1);
    switch (process) {
      case 'dense':
        for (let j = 0; j < 9; j++) mat[j] = u() * 10;
        break;
      case 'rank1': {
        const a = [u()*3, u()*3, u()*3], b = [u()*3, u()*3, u()*3];
        for (let i = 0; i < 3; i++) for (let j = 0; j < 3; j++) mat[i*3+j] = a[i]*b[j];
        break;
      }
      case 'rank2': {
        const a1=[u()*2,u()*2,u()*2], b1=[u()*2,u()*2,u()*2];
        const a2=[u()*2,u()*2,u()*2], b2=[u()*2,u()*2,u()*2];
        for (let i = 0; i < 3; i++) for (let j = 0; j < 3; j++) mat[i*3+j] = a1[i]*b1[j] + a2[i]*b2[j];
        break;
      }
      case 'symmetric': {
        const a = new Float64Array(9);
        for (let j = 0; j < 9; j++) a[j] = u() * 10;
        for (let i = 0; i < 3; i++) for (let j = 0; j < 3; j++) mat[i*3+j] = (a[i*3+j] + a[j*3+i]) / 2;
        break;
      }
      case 'skew': {
        const a = new Float64Array(9);
        for (let j = 0; j < 9; j++) a[j] = u() * 10;
        for (let i = 0; i < 3; i++) for (let j = 0; j < 3; j++) mat[i*3+j] = (a[i*3+j] - a[j*3+i]) / 2;
        break;
      }
      case 'triangular': {
        const upper = rng() < 0.5;
        for (let i = 0; i < 3; i++) for (let j = 0; j < 3; j++) {
          mat[i*3+j] = (upper ? j >= i : j <= i) ? u() * 10 : 0;
        }
        break;
      }
      case 'banded': {
        for (let i = 0; i < 3; i++) for (let j = 0; j < 3; j++) {
          mat[i*3+j] = Math.abs(i - j) <= 1 ? u() * 10 : 0;
        }
        break;
      }
      case 'integer': {
        const pool = [-2,-1,0,0,1,2];
        for (let j = 0; j < 9; j++) mat[j] = pool[(rng()*pool.length)|0] * 5;
        break;
      }
      case 'sparse':
      default: {
        const pz = rng() * 0.8;
        for (let j = 0; j < 9; j++) {
          const p = rng();
          mat[j] = p > pz ? u() * 10 : 0;
        }
      }
    }
    return mat;
  }

  // ---- Matrix UI ----
  const matrixInputs = [];
  function buildMatrixGrid() {
    matrixGrid.innerHTML = '';
    matrixInputs.length = 0;
    for (let i = 0; i < 9; i++) {
      const inp = document.createElement('input');
      inp.type = 'number';
      inp.step = '0.1';
      inp.addEventListener('input', () => {
        state.mat[i] = parseFloat(inp.value) || 0;
        save();
      });
      matrixGrid.appendChild(inp);
      matrixInputs.push(inp);
    }
  }
  function syncMatrixUI() {
    for (let i = 0; i < 9; i++) {
      const v = state.mat[i];
      matrixInputs[i].value = v.toFixed(3);
    }
  }
  function regenerateMatrix() {
    state.mat = Array.from(randomMatrix(state.seed, state.process));
    syncMatrixUI();
    save();
  }

  // ---- Color ----
  function hexToRgb(hex) {
    const m = hex.replace('#','');
    return [
      parseInt(m.slice(0,2), 16),
      parseInt(m.slice(2,4), 16),
      parseInt(m.slice(4,6), 16),
    ];
  }

  // ---- WebGPU setup ----
  let gpuAvailable = false;
  let gpuDevice = null;
  let gpuPipeline = null;
  const WGSL = `
    struct Params {
      W: u32, H: u32,
      iters_per_thread: u32,
      id_base: u32,
      scale: f32, cx: f32, cy: f32, z_scale: f32,
      m00: f32, m01: f32, m02: f32, _p0: f32,
      m10: f32, m11: f32, m12: f32, _p1: f32,
      m20: f32, m21: f32, m22: f32, _p2: f32,
      warmup: u32, _p3: u32, _p4: u32, _p5: u32,
    };
    @group(0) @binding(0) var<uniform> params: Params;
    @group(0) @binding(1) var<storage, read_write> count: array<atomic<u32>>;
    @group(0) @binding(2) var<storage, read_write> zSum: array<atomic<u32>>;

    @compute @workgroup_size(64)
    fn main(@builtin(global_invocation_id) gid: vec3<u32>) {
      let id = gid.x + params.id_base;
      let fid = f32(id);
      var x: f32 = cos(fid * 1.3 + 0.7);
      var y: f32 = sin(fid * 0.9 + 1.1);
      var z: f32 = cos(fid * 0.5 + 0.3);
      let m00 = params.m00; let m01 = params.m01; let m02 = params.m02;
      let m10 = params.m10; let m11 = params.m11; let m12 = params.m12;
      let m20 = params.m20; let m21 = params.m21; let m22 = params.m22;
      for (var i: u32 = 0u; i < params.warmup; i = i + 1u) {
        let nx = cos(m00*x + m01*y + m02*z);
        let ny = cos(m10*x + m11*y + m12*z);
        let nz = cos(m20*x + m21*y + m22*z);
        x = nx; y = ny; z = nz;
      }
      let W = params.W; let H = params.H;
      let Wi = i32(W); let Hi = i32(H);
      for (var i: u32 = 0u; i < params.iters_per_thread; i = i + 1u) {
        let nx = cos(m00*x + m01*y + m02*z);
        let ny = cos(m10*x + m11*y + m12*z);
        let nz = cos(m20*x + m21*y + m22*z);
        x = nx; y = ny; z = nz;
        let ix = i32(params.cx + x * params.scale);
        let iy = i32(params.cy + y * params.scale);
        if (ix >= 0 && ix < Wi && iy >= 0 && iy < Hi) {
          let idx = u32(iy) * W + u32(ix);
          atomicAdd(&count[idx], 1u);
          atomicAdd(&zSum[idx], u32((z + 1.0) * params.z_scale));
        }
      }
    }
  `;

  async function initGPU() {
    if (!navigator.gpu) return false;
    try {
      const adapter = await navigator.gpu.requestAdapter();
      if (!adapter) return false;
      gpuDevice = await adapter.requestDevice();
      gpuDevice.lost.then(() => { gpuDevice = null; gpuPipeline = null; gpuAvailable = false; });
      const module = gpuDevice.createShaderModule({ code: WGSL });
      gpuPipeline = gpuDevice.createComputePipeline({
        layout: 'auto',
        compute: { module, entryPoint: 'main' },
      });
      gpuAvailable = true;
      return true;
    } catch (e) {
      console.warn('WebGPU init failed:', e);
      return false;
    }
  }

  // ---- Rendering ----
  let computing = false;
  let stopRequested = false;
  const BATCH = 20000;

  function setProgress(label, frac) {
    progressText.textContent = label;
    const pct = Math.max(0, Math.min(1, frac)) * 100;
    progressFill.style.width = pct.toFixed(1) + '%';
    progressPct.textContent = pct.toFixed(0) + '%';
  }

  function yieldToUI() { return new Promise(r => setTimeout(r, 0)); }

  async function generate() {
    if (computing) return;
    computing = true;
    stopRequested = false;
    renderBtn.disabled = true;
    stopBtn.disabled = false;
    progressEl.classList.add('active');
    setProgress('Initializing', 0);

    syncStateFromInputs();
    save();

    const W = state.renderSize, H = state.renderSize;
    const N = state.nPts;
    const mat = new Float64Array(state.mat);

    const off = document.createElement('canvas');
    off.width = W;
    off.height = H;
    const offCtx = off.getContext('2d');
    state.rendered = off;
    fitToView();

    const bg = hexToRgb(state.bgColor);
    const c1 = hexToRgb(state.color1);
    const c2 = hexToRgb(state.color2);

    let engineUsed = 'workers';
    if (state.mode === 'scatter') {
      await renderScatter(offCtx, W, H, N, mat, bg, c1, c2);
      engineUsed = 'scatter';
    } else {
      const wantGPU = state.engine === 'webgpu' || (state.engine === 'auto' && gpuAvailable);
      const bufferBytes = W * H * 4;
      const maxBuf = gpuDevice ? gpuDevice.limits.maxStorageBufferBindingSize : 0;
      const gpuFits = bufferBytes <= maxBuf;
      if (wantGPU && gpuAvailable && gpuFits) {
        engineUsed = 'webgpu';
        await renderDensityGPU(offCtx, W, H, N, mat, bg, c1, c2);
      } else {
        if (wantGPU && !gpuFits) {
          console.warn(`WebGPU buffer too large (${bufferBytes} > ${maxBuf}); falling back to workers`);
        }
        engineUsed = 'workers';
        await renderDensity(offCtx, W, H, N, mat, bg, c1, c2);
      }
    }

    setProgress('Done', 1);
    const stopped = stopRequested;
    statusEl.textContent = `${stopped ? 'Stopped · ' : ''}seed ${state.seed} · ${N.toLocaleString()} pts · ${W}×${H} · ${engineUsed} · scroll to zoom, drag to pan`;
    progressEl.classList.remove('active');
    renderBtn.disabled = false;
    stopBtn.disabled = true;
    computing = false;
    stopRequested = false;
    draw();
  }

  // SCATTER MODE: arcs with alpha (matches original)
  async function renderScatter(offCtx, W, H, N, mat, bg, c1, c2) {
    offCtx.fillStyle = `rgb(${bg[0]},${bg[1]},${bg[2]})`;
    offCtx.fillRect(0, 0, W, H);

    const scale = (Math.min(W, H) / 2) / 1.05;
    const cx = W / 2, cy = H / 2;
    const ptsz = state.ptSize;
    const alpha = state.alpha;

    let x = 1, y = 1, z = 1;
    let lastYield = performance.now();

    for (let i = 0; i < N; i++) {
      const nx = Math.cos(mat[0]*x + mat[1]*y + mat[2]*z);
      const ny = Math.cos(mat[3]*x + mat[4]*y + mat[5]*z);
      const nz = Math.cos(mat[6]*x + mat[7]*y + mat[8]*z);
      x = nx; y = ny; z = nz;

      const t0 = 0.5 * (z + 1);
      const t1 = 1 - t0;
      const r = Math.floor(c1[0]*t0 + c2[0]*t1);
      const g = Math.floor(c1[1]*t0 + c2[1]*t1);
      const b = Math.floor(c1[2]*t0 + c2[2]*t1);
      offCtx.fillStyle = `rgba(${r},${g},${b},${alpha})`;
      offCtx.beginPath();
      offCtx.arc(cx + x * scale, cy + y * scale, ptsz, 0, Math.PI * 2);
      offCtx.fill();

      if ((i & 0x3FFF) === 0) {
        const now = performance.now();
        if (now - lastYield > 50) {
          setProgress('Plotting', i / N);
          draw();
          await yieldToUI();
          if (stopRequested) return;
          lastYield = now;
        }
      }
    }
  }

  // DENSITY MODE: parallel HDR accumulator via Web Workers
  const WORKER_SRC = `
    let stop = false;
    self.addEventListener('message', e => {
      const m = e.data;
      if (m.type === 'stop') { stop = true; return; }
      if (m.type !== 'start') return;
      const { W, H, N, mat, workerId } = m;
      const total = W * H;
      const count = new Float32Array(total);
      const zSum = new Float32Array(total);
      const scale = (Math.min(W, H) / 2) / 1.05;
      const cx = W / 2, cy = H / 2;
      // distinct starting point per worker so chains decorrelate
      let x = Math.cos(workerId * 1.3 + 0.7);
      let y = Math.sin(workerId * 0.9 + 1.1);
      let z = Math.cos(workerId * 0.5 + 0.3);
      for (let i = 0; i < 200; i++) {
        const nx = Math.cos(mat[0]*x + mat[1]*y + mat[2]*z);
        const ny = Math.cos(mat[3]*x + mat[4]*y + mat[5]*z);
        const nz = Math.cos(mat[6]*x + mat[7]*y + mat[8]*z);
        x = nx; y = ny; z = nz;
      }
      let i = 0, lastSnap = performance.now();
      function loop() {
        const t0 = performance.now();
        while (i < N && !stop) {
          const nx = Math.cos(mat[0]*x + mat[1]*y + mat[2]*z);
          const ny = Math.cos(mat[3]*x + mat[4]*y + mat[5]*z);
          const nz = Math.cos(mat[6]*x + mat[7]*y + mat[8]*z);
          x = nx; y = ny; z = nz;
          const ix = (cx + x * scale) | 0;
          const iy = (cy + y * scale) | 0;
          if (ix >= 0 && ix < W && iy >= 0 && iy < H) {
            const idx = iy * W + ix;
            count[idx] += 1;
            zSum[idx] += z;
          }
          i++;
          if ((i & 0xFFFF) === 0) {
            const now = performance.now();
            if (now - lastSnap > 500) {
              self.postMessage({
                type: 'snapshot',
                count: new Float32Array(count),
                zSum: new Float32Array(zSum),
                done: i,
              });
              lastSnap = now;
              setTimeout(loop, 0); // yield so 'stop' messages can land
              return;
            }
            if (now - t0 > 100) { setTimeout(loop, 0); return; }
          }
        }
        self.postMessage(
          { type: 'done', count, zSum, done: i },
          [count.buffer, zSum.buffer]
        );
      }
      loop();
    });
  `;

  async function renderDensity(offCtx, W, H, N, mat, bg, c1, c2) {
    const total = W * H;
    const img = offCtx.createImageData(W, H);
    const px = img.data;
    const nW = Math.max(1, state.workers | 0);
    const perWorker = Math.ceil(N / nW);

    const blob = new Blob([WORKER_SRC], { type: 'application/javascript' });
    const url = URL.createObjectURL(blob);

    const workers = [];
    const partials = new Array(nW).fill(null);
    const progress = new Int32Array(nW);
    let doneCount = 0;
    const sumCount = new Float32Array(total);
    const sumZ = new Float32Array(total);

    function mergeAndDraw() {
      sumCount.fill(0);
      sumZ.fill(0);
      let maxC = 0;
      for (const part of partials) {
        if (!part) continue;
        const c = part.count, zs = part.zSum;
        for (let i = 0; i < total; i++) {
          const v = sumCount[i] + c[i];
          sumCount[i] = v;
          sumZ[i] += zs[i];
          if (v > maxC) maxC = v;
        }
      }
      tonemap(px, sumCount, sumZ, total, bg, c1, c2, maxC, state.gamma);
      offCtx.putImageData(img, 0, 0);
      draw();
      state.density = { count: sumCount, zSum: sumZ, maxC, W, H, offCtx, img };
    }

    await new Promise(resolve => {
      const tick = setInterval(() => {
        if (stopRequested) {
          for (const w of workers) w.postMessage({ type: 'stop' });
        }
        const totalDone = progress.reduce((a,b) => a + b, 0);
        setProgress(`Plotting (${nW} worker${nW>1?'s':''})`, totalDone / N);
      }, 200);

      const finish = () => {
        clearInterval(tick);
        for (const w of workers) w.terminate();
        URL.revokeObjectURL(url);
        resolve();
      };

      for (let i = 0; i < nW; i++) {
        const w = new Worker(url);
        workers.push(w);
        w.onmessage = e => {
          const m = e.data;
          if (m.type === 'snapshot') {
            partials[i] = { count: m.count, zSum: m.zSum };
            progress[i] = m.done;
            mergeAndDraw();
          } else if (m.type === 'done') {
            partials[i] = { count: m.count, zSum: m.zSum };
            progress[i] = m.done;
            doneCount++;
            if (doneCount === nW) { mergeAndDraw(); finish(); }
          }
        };
        w.postMessage({
          type: 'start',
          W, H, N: perWorker, mat: Array.from(mat), workerId: i,
        });
      }
    });
  }

  // DENSITY MODE on WebGPU: batched compute dispatches, CPU-side accumulation
  async function renderDensityGPU(offCtx, W, H, N, mat, bg, c1, c2) {
    const total = W * H;
    const img = offCtx.createImageData(W, H);
    const px = img.data;
    const sumCount = new Float64Array(total);
    const sumZ = new Float64Array(total);

    const scale = (Math.min(W, H) / 2) / 1.05;
    // Per-batch zSum can't overflow u32. Hot pixel ~1% of batch points.
    // With Z_SCALE=1000 and batch<=10M points: 2 * 10M * 0.01 * 1000 = 2e8 — safe.
    const Z_SCALE = 1000.0;
    const WG_SIZE = 64;
    const WG_COUNT = 1024;          // 64k threads per dispatch
    const THREADS = WG_SIZE * WG_COUNT;
    const ITERS_PER_BATCH = Math.max(64, Math.min(160, Math.floor(10_000_000 / THREADS)));
    const POINTS_PER_BATCH = THREADS * ITERS_PER_BATCH;

    const dev = gpuDevice;
    const paramsBuf = dev.createBuffer({
      size: 96, usage: GPUBufferUsage.UNIFORM | GPUBufferUsage.COPY_DST,
    });
    const bufBytes = total * 4;
    const countBuf = dev.createBuffer({
      size: bufBytes, usage: GPUBufferUsage.STORAGE | GPUBufferUsage.COPY_SRC | GPUBufferUsage.COPY_DST,
    });
    const zSumBuf = dev.createBuffer({
      size: bufBytes, usage: GPUBufferUsage.STORAGE | GPUBufferUsage.COPY_SRC | GPUBufferUsage.COPY_DST,
    });
    const readCount = dev.createBuffer({
      size: bufBytes, usage: GPUBufferUsage.COPY_DST | GPUBufferUsage.MAP_READ,
    });
    const readZ = dev.createBuffer({
      size: bufBytes, usage: GPUBufferUsage.COPY_DST | GPUBufferUsage.MAP_READ,
    });
    const zeros = new Uint8Array(bufBytes);

    const bindGroup = dev.createBindGroup({
      layout: gpuPipeline.getBindGroupLayout(0),
      entries: [
        { binding: 0, resource: { buffer: paramsBuf }},
        { binding: 1, resource: { buffer: countBuf }},
        { binding: 2, resource: { buffer: zSumBuf }},
      ],
    });

    function writeParams(itersPerThread, idBase, warmup) {
      const u = new ArrayBuffer(96);
      const dv = new DataView(u);
      dv.setUint32(0, W, true);
      dv.setUint32(4, H, true);
      dv.setUint32(8, itersPerThread, true);
      dv.setUint32(12, idBase, true);
      dv.setFloat32(16, scale, true);
      dv.setFloat32(20, W / 2, true);
      dv.setFloat32(24, H / 2, true);
      dv.setFloat32(28, Z_SCALE, true);
      const off = 32;
      // 3x mat3 with padding to vec4 alignment
      dv.setFloat32(off+ 0, mat[0], true); dv.setFloat32(off+ 4, mat[1], true); dv.setFloat32(off+ 8, mat[2], true);
      dv.setFloat32(off+16, mat[3], true); dv.setFloat32(off+20, mat[4], true); dv.setFloat32(off+24, mat[5], true);
      dv.setFloat32(off+32, mat[6], true); dv.setFloat32(off+36, mat[7], true); dv.setFloat32(off+40, mat[8], true);
      dv.setUint32(off+48, warmup, true);
      dev.queue.writeBuffer(paramsBuf, 0, u);
    }

    let placed = 0;
    let idBase = 0;
    let firstBatch = true;

    while (placed < N && !stopRequested) {
      const itersThisBatch = Math.min(ITERS_PER_BATCH, Math.max(1, Math.ceil((N - placed) / THREADS)));
      const pointsThisBatch = THREADS * itersThisBatch;
      const warmup = 100;

      // zero buffers
      dev.queue.writeBuffer(countBuf, 0, zeros);
      dev.queue.writeBuffer(zSumBuf, 0, zeros);
      writeParams(itersThisBatch, idBase, warmup);

      const enc = dev.createCommandEncoder();
      const pass = enc.beginComputePass();
      pass.setPipeline(gpuPipeline);
      pass.setBindGroup(0, bindGroup);
      pass.dispatchWorkgroups(WG_COUNT);
      pass.end();
      enc.copyBufferToBuffer(countBuf, 0, readCount, 0, bufBytes);
      enc.copyBufferToBuffer(zSumBuf, 0, readZ, 0, bufBytes);
      dev.queue.submit([enc.finish()]);

      await readCount.mapAsync(GPUMapMode.READ);
      await readZ.mapAsync(GPUMapMode.READ);
      const cArr = new Uint32Array(readCount.getMappedRange().slice(0));
      const zArr = new Uint32Array(readZ.getMappedRange().slice(0));
      readCount.unmap();
      readZ.unmap();

      let maxC = 0;
      for (let i = 0; i < total; i++) {
        const c = sumCount[i] + cArr[i];
        sumCount[i] = c;
        // decode z: per pixel batch sum contributed (z+1)*Z_SCALE per hit.
        // We want overall avg z, so accumulate raw (z+1)*hits in zSum and decode at tonemap.
        sumZ[i] += zArr[i] / Z_SCALE - cArr[i]; // → sum of z over hits
        if (c > maxC) maxC = c;
      }

      // tonemap expects zSum=sum of z over hits, avgZ=zSum/count. That's what we have.
      tonemap(px, sumCount, sumZ, total, bg, c1, c2, maxC, state.gamma);
      offCtx.putImageData(img, 0, 0);
      draw();
      state.density = { count: sumCount, zSum: sumZ, maxC, W, H, offCtx, img };

      placed += pointsThisBatch;
      idBase += THREADS;
      firstBatch = false;
      setProgress('Plotting (WebGPU)', Math.min(1, placed / N));
      await new Promise(r => setTimeout(r, 0));
    }

    paramsBuf.destroy();
    countBuf.destroy();
    zSumBuf.destroy();
    readCount.destroy();
    readZ.destroy();
  }

  function tonemap(px, count, zSum, total, bg, c1, c2, maxCount, gamma) {
    if (maxCount <= 0) return;
    const logMax = Math.log(1 + maxCount);
    for (let i = 0; i < total; i++) {
      const c = count[i];
      const p = i * 4;
      if (c === 0) {
        px[p] = bg[0];
        px[p+1] = bg[1];
        px[p+2] = bg[2];
        px[p+3] = 255;
      } else {
        let v = Math.log(1 + c) / logMax;
        v = Math.pow(v, gamma);
        const zAvg = zSum[i] / c;
        const t0 = 0.5 * (zAvg + 1);
        const t1 = 1 - t0;
        const fr = c1[0]*t0 + c2[0]*t1;
        const fg = c1[1]*t0 + c2[1]*t1;
        const fb = c1[2]*t0 + c2[2]*t1;
        px[p]   = (bg[0] * (1 - v) + fr * v) | 0;
        px[p+1] = (bg[1] * (1 - v) + fg * v) | 0;
        px[p+2] = (bg[2] * (1 - v) + fb * v) | 0;
        px[p+3] = 255;
      }
    }
  }

  // ---- Pan / zoom ----
  let view = { scale: 1, ox: 0, oy: 0 };

  function resizeCanvasToCSS() {
    const dpr = window.devicePixelRatio || 1;
    const w = canvas.clientWidth, h = canvas.clientHeight;
    if (canvas.width !== w * dpr || canvas.height !== h * dpr) {
      canvas.width = w * dpr;
      canvas.height = h * dpr;
    }
  }

  function fitToView() {
    resizeCanvasToCSS();
    if (!state.rendered) return;
    const cw = canvas.width, ch = canvas.height;
    const W = state.rendered.width, H = state.rendered.height;
    const margin = 20 * (window.devicePixelRatio || 1);
    const s = Math.min((cw - margin * 2) / W, (ch - margin * 2) / H);
    view.scale = s;
    view.ox = (cw - W * s) / 2;
    view.oy = (ch - H * s) / 2;
  }

  function draw() {
    resizeCanvasToCSS();
    ctx.setTransform(1,0,0,1,0,0);
    ctx.fillStyle = state.bgColor;
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    if (!state.rendered) return;
    ctx.imageSmoothingEnabled = false;
    ctx.setTransform(view.scale, 0, 0, view.scale, view.ox, view.oy);
    ctx.drawImage(state.rendered, 0, 0);
  }

  canvas.addEventListener('wheel', e => {
    e.preventDefault();
    if (!state.rendered) return;
    const dpr = window.devicePixelRatio || 1;
    const rect = canvas.getBoundingClientRect();
    const mx = (e.clientX - rect.left) * dpr;
    const my = (e.clientY - rect.top) * dpr;
    const factor = Math.exp(-e.deltaY * 0.0015);
    const newScale = Math.max(0.05, Math.min(200, view.scale * factor));
    view.ox = mx - (mx - view.ox) * (newScale / view.scale);
    view.oy = my - (my - view.oy) * (newScale / view.scale);
    view.scale = newScale;
    draw();
  }, { passive: false });

  let drag = null;
  canvas.addEventListener('mousedown', e => {
    drag = { x: e.clientX, y: e.clientY, ox: view.ox, oy: view.oy };
    canvas.classList.add('dragging');
  });
  window.addEventListener('mousemove', e => {
    if (!drag) return;
    const dpr = window.devicePixelRatio || 1;
    view.ox = drag.ox + (e.clientX - drag.x) * dpr;
    view.oy = drag.oy + (e.clientY - drag.y) * dpr;
    draw();
  });
  window.addEventListener('mouseup', () => {
    drag = null;
    canvas.classList.remove('dragging');
  });
  window.addEventListener('resize', () => { resizeCanvasToCSS(); draw(); });

  // ---- Wiring ----
  randomSeedBtn.addEventListener('click', () => {
    const s = Math.floor(Math.random() * 4294967295);
    seedInput.value = s;
    state.seed = s;
    regenerateMatrix();
    generate();
  });
  presetSeeds.addEventListener('change', () => {
    if (presetSeeds.value) {
      seedInput.value = presetSeeds.value;
      state.seed = parseInt(presetSeeds.value, 10) >>> 0;
      regenerateMatrix();
      generate();
      presetSeeds.value = '';
    }
  });
  seedInput.addEventListener('change', () => {
    state.seed = parseInt(seedInput.value, 10) >>> 0;
    regenerateMatrix();
  });
  processInput.addEventListener('change', () => {
    state.process = processInput.value;
    regenerateMatrix();
    save();
  });
  matrixRegen.addEventListener('click', () => {
    regenerateMatrix();
    generate();
  });
  ptsHalf.addEventListener('click', () => {
    nPtsInput.value = Math.max(1000, Math.floor((parseInt(nPtsInput.value, 10) || 1000) / 2));
  });
  ptsDouble.addEventListener('click', () => {
    nPtsInput.value = (parseInt(nPtsInput.value, 10) || 1000) * 2;
  });
  modeSelect.addEventListener('change', updateModeRows);
  engineInput.addEventListener('change', updateModeRows);

  // Live re-tonemap on changes that only affect tonemapping (no recompute needed)
  function retonemapIfPossible() {
    const d = state.density;
    if (!d) return;
    const bg = hexToRgb(state.bgColor);
    const c1 = hexToRgb(state.color1);
    const c2 = hexToRgb(state.color2);
    tonemap(d.img.data, d.count, d.zSum, d.W * d.H, bg, c1, c2, d.maxC, state.gamma);
    d.offCtx.putImageData(d.img, 0, 0);
    draw();
  }
  const gammaVal = $('gamma-val');
  gammaInput.addEventListener('input', () => {
    state.gamma = parseFloat(gammaInput.value) || DEFAULTS.gamma;
    gammaVal.textContent = state.gamma.toFixed(2);
    retonemapIfPossible();
  });
  for (const el of [bgColorInput, color1Input, color2Input]) {
    el.addEventListener('input', () => {
      state.bgColor = bgColorInput.value;
      state.color1 = color1Input.value;
      state.color2 = color2Input.value;
      retonemapIfPossible();
    });
  }
  renderBtn.addEventListener('click', generate);
  stopBtn.addEventListener('click', () => {
    if (computing) { stopRequested = true; stopBtn.disabled = true; }
  });
  exportBtn.addEventListener('click', () => {
    if (!state.rendered) { alert('Generate first'); return; }
    state.rendered.toBlob(blob => {
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `cosmap-${state.seed}-${state.renderSize}.png`;
      a.click();
      URL.revokeObjectURL(url);
    }, 'image/png');
  });
  resetBtn.addEventListener('click', () => {
    if (!confirm('Reset all parameters to defaults?')) return;
    Object.assign(state, DEFAULTS);
    state.mat = Array.from(randomMatrix(state.seed, state.process));
    syncInputsFromState();
    save();
    generate();
  });
  // persist on any control change
  for (const el of [seedInput, nPtsInput, renderSizeInput, modeSelect, ptSizeInput, alphaInput, gammaInput, bgColorInput, color1Input, color2Input, workersInput, engineInput, processInput]) {
    el.addEventListener('change', () => { syncStateFromInputs(); save(); });
  }

  // ---- Init ----
  buildMatrixGrid();
  load();
  syncInputsFromState();
  resizeCanvasToCSS();
  initGPU().then(() => { updateModeRows(); generate(); });
})();
</script>
</body>
</html>
